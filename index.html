/* Layout: 春の限定コレクションのような、淡い桜とバニラの紙面。英字の小見出し+明朝の見出し、細い罫線、たっぷりの余白。下に固定タブ。 */

  --vanilla:#f4ead9;
  --honey:#b88a3e;
  --cell:#f1e7e3;
  --en:"Cormorant Garamond","Times New Roman",serif;
  --label:"Jost","Futura","Century Gothic",sans-serif;
  --display:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;

  --r:18px;
}

nav.tabs button{background:none;border:0;padding:10px 2px 11px;font-size:.72rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
nav.tabs button .k{font-family:var(--en);font-style:italic;font-size:1rem;line-height:1.1;letter-spacing:.02em}
nav.tabs button[aria-current="page"]{color:var(--sakura-deep)}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:2px;border-radius:2px;background:var(--sakura)}

/* blocks */
.stack{display:flex;flex-direction:column;gap:18px}
.section-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;margin-top:10px}
.section-head .en{font-size:1.5rem;line-height:1.1}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:22px 20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;padding:1px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;background:var(--sheet);letter-spacing:.06em}
.chip.kenri{border-color:#d9c3dc;color:#8b6a92;background:#f7eff8}
.chip.hourei{border-color:#e7d3ad;color:var(--honey);background:#fbf4e6}
.chip.zei{border-color:#c9d8bf;color:#6b8660;background:var(--leaf-soft)}
.chip.gyoho{border-color:#ebc3cb;color:var(--sakura-deep);background:var(--sakura-soft)}
:root[data-theme="dark"] .chip.kenri{background:#33283a;border-color:#4f3d57;color:#cfb3d6}
:root[data-theme="dark"] .chip.hourei{background:#382f20;border-color:#56462a;color:var(--honey)}
:root[data-theme="dark"] .chip.zei{border-color:#3e5236;color:var(--leaf)}
:root[data-theme="dark"] .chip.gyoho{border-color:#5a3a42}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.kenri{background:#33283a;border-color:#4f3d57;color:#cfb3d6}
 :root:not([data-theme="light"]) .chip.hourei{background:#382f20;border-color:#56462a;color:var(--honey)}
 :root:not([data-theme="light"]) .chip.zei{border-color:#3e5236;color:var(--leaf)}
 :root:not([data-theme="light"]) .chip.gyoho{border-color:#5a3a42}}
.chip.ai{border-style:dashed}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:8px 20px;font-size:.86rem;transition:border-color .2s,background .2s}
.btn:hover{border-color:var(--sakura)}
.btn.primary{background:var(--sakura-deep);border-color:var(--sakura-deep);color:var(--sheet)}
.btn.primary:hover{background:var(--sakura);border-color:var(--sakura)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--sakura-deep);border-color:var(--sakura)}
.btn.small{padding:4px 14px;font-size:.78rem}
.btn:disabled{opacity:.45;cursor:default}
textarea,input[type=text],input[type=date],input[type=number],select{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px;max-width:100%;width:100%}
textarea{min-height:72px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);min-width:0}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.form .full{grid-column:1/-1}

/* quota */
.quota{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.quota>div{padding:4px 10px;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px}
.quota>div:last-child{border-right:0}
.quota .v{font-family:var(--en);font-size:2rem;line-height:1.1;font-weight:500}
.quota .v small{font-family:var(--body);font-size:.75rem;color:var(--muted)}
.ring{--p:0;width:100%;height:3px;background:var(--cell);border-radius:3px;overflow:hidden;margin-top:4px}
.ring i{display:block;height:100%;width:calc(var(--p)*1%);background:var(--sakura)}

/* filter pills */
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills.center{justify-content:center}
.pills button{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:3px 14px;font-size:.8rem;color:var(--muted)}
.pills button[aria-pressed="true"]{border-color:var(--sakura);background:var(--sakura-soft);color:var(--sakura-deep)}

/* question card */
.qcard{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:26px 22px 22px;display:flex;flex-direction:column;gap:18px;position:relative}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.qtext{font-family:var(--display);font-size:1.12rem;line-height:2;letter-spacing:.06em}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.judge button{border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:16px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:border-color .2s,background .2s}
.judge button:hover{border-color:var(--sakura)}
.judge .mk{font-family:var(--display);font-size:2.2rem;line-height:1}
.judge .o .mk{color:var(--leaf)} .judge .x .mk{color:var(--sakura-deep)}
.judge small{font-size:.74rem;color:var(--muted)}
.result{border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.result.ok{background:var(--leaf-soft)} .result.ng{background:var(--sakura-soft)}
.result .head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.result .head b{font-family:var(--display);font-size:1.25rem;font-weight:600}
.result.ok .head b{color:var(--leaf)} .result.ng .head b{color:var(--sakura-deep)}
.explain{font-size:.9rem}

/* list */
.qlist{display:flex;flex-direction:column}
.qitem{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.qitem:last-child{border-bottom:0}
.qitem .s{font-size:.92rem}
details>summary{cursor:pointer;color:var(--sakura-deep);font-size:.8rem;list-style:none}
details>summary::-webkit-details-marker{display:none}
details[open]>summary{margin-bottom:4px}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cell);border:1px solid var(--line)}
.sdot.o{background:var(--leaf);border-color:var(--leaf)} .sdot.u{background:var(--honey);border-color:var(--honey)} .sdot.x{background:var(--sakura-deep);border-color:var(--sakura-deep)} .sdot.m{background:var(--sakura);border-color:var(--sakura)}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:.86rem}
.tbl th,.tbl td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-family:var(--label);font-size:.66rem;color:var(--muted);font-weight:400;letter-spacing:.2em;text-transform:uppercase}
.tbl td.n,.tbl th.n{text-align:right;white-space:nowrap}
.tbl td.n{font-family:var(--label);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}

/* radar */
.radar{width:100%;max-width:440px;display:block;margin:0 auto}
.radar text{fill:var(--ink);font-family:var(--body);font-size:12px;letter-spacing:.06em}
.radar .ax{stroke:var(--line);fill:none}
.radar .tg{stroke:var(--muted);stroke-dasharray:3 4;fill:none}
.radar .me{fill:var(--sakura);fill-opacity:.28;stroke:var(--sakura-deep);stroke-width:1.5}
.radar .pt{fill:var(--sakura-deep)}

/* heat */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);grid-auto-columns:11px;justify-content:start;gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:11px;height:11px;border-radius:50%;background:var(--cell)}
.heat i.l1{background:color-mix(in srgb,var(--sakura) 40%,var(--cell))}
.heat i.l2{background:color-mix(in srgb,var(--sakura) 75%,var(--cell))}
.heat i.l3{background:var(--sakura-deep)}

/* flash */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:none;padding:6px 18px;font-size:.84rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sakura-soft);color:var(--sakura-deep)}
.flash{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:30px 22px;min-height:240px;display:flex;flex-direction:column;gap:16px;justify-content:space-between;text-align:center;align-items:center}
.flash .q{font-family:var(--display);font-size:1.08rem;line-height:1.9}
.flash .a{font-family:var(--display);font-size:1.45rem;font-weight:600;color:var(--sakura-deep);line-height:1.5}
.flash .note{font-size:.82rem;color:var(--muted)}
.hide{display:inline-block;min-width:7em;border-radius:8px;background:var(--cell);color:transparent;cursor:pointer;user-select:none;padding:0 8px}
.hide.show{background:none;color:var(--sakura-deep);cursor:default;font-weight:500}

/* mock */
.clock{font-family:var(--en);font-size:2.8rem;font-weight:500;line-height:1}
.clock.low{color:var(--sakura-deep)}
.mcells{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.mcells button{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:3px 0;font-family:var(--label);font-size:.74rem;color:var(--muted)}
.mcells button.done{background:var(--sakura-soft);border-color:var(--sakura);color:var(--sakura-deep)}
.mcells button.ok{background:var(--leaf-soft);border-color:var(--leaf);color:var(--leaf)}
.mcells button.ng{background:var(--sakura-soft);border-color:var(--sakura-deep);color:var(--sakura-deep)}
.mcells button.cur{outline:1.5px solid var(--ink);outline-offset:1px}
.mcells button:disabled{opacity:.35}
.choices{display:flex;flex-direction:column;gap:10px;counter-reset:ch}
.choices button{display:grid;grid-template-columns:30px 1fr;gap:10px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;font-size:.92rem;line-height:1.75}
.choices button .no{font-family:var(--en);font-size:1.3rem;line-height:1.2;color:var(--muted);text-align:center}
.choices button[aria-pressed="true"]{border-color:var(--sakura-deep);background:var(--sakura-soft)}
.choices button[aria-pressed="true"] .no{color:var(--sakura-deep)}
.score{font-family:var(--en);font-size:3.6rem;font-weight:500;line-height:1}
.verdict{display:inline-block;font-family:var(--display);border:1px solid currentColor;border-radius:999px;padding:2px 16px;align-self:flex-start;font-size:.9rem}
.verdict.pass{color:var(--leaf)} .verdict.fail{color:var(--sakura-deep)}
.hbar{display:grid;grid-template-columns:100px 1fr 56px;gap:10px;align-items:center;font-size:.82rem}
.hbar .tr{height:6px;background:var(--cell);border-radius:6px;position:relative}
.hbar .tr i{position:absolute;inset:0 auto 0 0;background:var(--sakura);border-radius:6px}
.hbar .tr b{position:absolute;top:-4px;bottom:-4px;width:1.5px;background:var(--ink)}
.review{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.review .c{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:.86rem}
.review .c .mk{font-family:var(--display);text-align:center}
.review .c.pick{background:var(--sakura-soft);border-radius:8px}

.note-box{border-left:2px solid var(--sakura);padding:8px 14px;background:var(--sakura-soft);border-radius:0 12px 12px 0;font-size:.86rem}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
#gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
#gate .gatein{max-width:460px;width:100%;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:28px 22px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:999px;font-size:.82rem;z-index:20;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:4px 12px;font-size:.86rem}
.thinking{font-family:var(--en);font-style:italic;color:var(--sakura-deep)}
hr.leaf{border:0;height:1px;background:var(--line);margin:4px 0}
@media (max-width:520px){

<script>

function ymd(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function today(){ return ymd(new Date()); }
function parse(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=parse(s); d.setDate(d.getDate()+n); return ymd(d); }
function diff(a,b){ return Math.round((parse(b)-parse(a))/86400000); }
function fmtJ(s){ const d=parse(s); return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`; }

function bodyOf(id){
  if(id==="settings") return {...S.settings};
  if(SINGLE[id]) return {[SINGLE[id]]:S[id]};
  if(id.startsWith("mock-")) return S.mocks[id]||null;
  if(id.startsWith("blog-")){ const m=id.slice(5), l={}; Object.entries(S.blog).forEach(([k,v])=>{ if(v.d.slice(0,7)===m) l[k]=v; }); return Object.keys(l).length?{l}:null; }
  return null;
}
let flushTimer=null, flushing=false;
function mark(id){ dirty.add(id); lsSave(); clearTimeout(flushTimer); flushTimer=setTimeout(flush,600); }
async function flush(){
  if(backend!=="db"||!col||flushing) return;
  flushing=true;
  try{
    while(dirty.size){
      const id=[...dirty][0]; dirty.delete(id);
      const b=bodyOf(id);
      try{ if(b===null) await col.doc(id).delete(); else await col.doc(id).set(JSON.parse(JSON.stringify(b))); }
      catch(e){
        if(e&&e.code==="unavailable"){ dirty.add(id); await new Promise(r=>setTimeout(r,800+Math.random()*800)); }
        else if(e&&e.code==="quota_exceeded"){ toast("保存容量の上限です。古い模試の記録を削除してください"); }
        else console.warn(e);
      }
    }
  } finally { flushing=false; }
}
function applyDoc(id,b){
  if(id==="settings") S.settings={...DEFAULT_SETTINGS,...b};
  else if(SINGLE[id]){ S[id]=b[SINGLE[id]]||{}; if(id==="books"&&(!S.books.text||!S.books.drill)) S.books={...JSON.parse(JSON.stringify(DEFAULT_BOOKS)),...S.books}; }
  else if(id.startsWith("mock-")) S.mocks[id]=b;
  else if(id.startsWith("blog-")){ const m=id.slice(5); Object.keys(S.blog).forEach(k=>{ if(S.blog[k].d.slice(0,7)===m) delete S.blog[k]; }); Object.assign(S.blog,b.l||{}); }
}
function removeDoc(id){
  if(id==="settings") S.settings={...DEFAULT_SETTINGS};
  else if(SINGLE[id]) S[id]=id==="books"?JSON.parse(JSON.stringify(DEFAULT_BOOKS)):{};
  else if(id.startsWith("mock-")) delete S.mocks[id];
  else if(id.startsWith("blog-")){ const m=id.slice(5); Object.keys(S.blog).forEach(k=>{ if(S.blog[k].d.slice(0,7)===m) delete S.blog[k]; }); }
}
function applySnapshot(snap){
  // 届いた文書だけを反映する(届いていない文書を空で上書きしない)
  snap.docs.forEach(d=>{ const id=d.id; if(dirty.has(id)) return; const b=JSON.parse(JSON.stringify(d.data()||{})); applyDoc(id,b); });
  if(typeof snap.docChanges==="function"){ try{ snap.docChanges().forEach(c=>{ if(c.type==="removed"&&!dirty.has(c.doc.id)&&!snap.docs.some(d=>d.id===c.doc.id)) removeDoc(c.doc.id); }); }catch(e){} }
  migrateRedo(); lsSave();
}
function allDocIds(){ return ["settings","qs","myq","cards","mycards","log","books","bidx","redo","pa","pm","pq","cardov","exams","qov",...Object.keys(S.mocks),...[...new Set(Object.values(S.blog).map(v=>blogDoc(v.d)))]]; }
let unsub=null;
function attachCol(c){
  col=c;
  const localHad=Object.keys(S.qs).length||Object.keys(S.myq).length||Object.keys(S.mycards).length||Object.keys(S.blog).length||S.books.text.ch.length||Object.keys(S.pa).length;
  let first=true;
  if(unsub) try{ unsub(); }catch(e){}
  unsub=col.onSnapshot(snap=>{
    if(first){ first=false; backend="db"; setSync();
      if(snap.empty&&localHad){ allDocIds().forEach(id=>dirty.add(id)); flush(); render(); return; } }
    applySnapshot(snap); if(!busyTyping()) render();
  },()=>{ backend="local"; setSync(); });
}

  const cfg=fbConfig();

  try{ firebase.initializeApp(cfg); }catch(e){ if(!/already exists/.test(String(e))){ showGate("setup","設定が正しくありません:"+e.message); return; } }
  const auth=firebase.auth(), fs=firebase.firestore();
  try{ fs.enablePersistence({synchronizeTabs:true}).catch(()=>{}); }catch(e){}
  showGate("wait");
  try{ auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{}); }catch(e){}
  let authKnown=false, redirErr="";
  auth.getRedirectResult().catch(e=>{ redirErr=loginErr(e); if(authKnown&&!auth.currentUser) showGate("login",redirErr); });
  auth.onAuthStateChanged(u=>{
    FB_USER=u; authKnown=true;
    if(!u){ backend="local"; if(unsub) try{unsub();}catch(e){} col=null; setSync(); showGate("login",redirErr); return; }
    showGate(null);
    const c=fs.collection("users").doc(u.uid).collection("docs");

      doc:id=>({ set:b=>c.doc(id).set({j:JSON.stringify(b),t:Date.now()}), delete:()=>c.doc(id).delete() }),

    });
    render();
  });
}

function allQ(){
  const ov=S.qov||{};
  const mine=Object.entries(S.myq).map(([id,q])=>({id,...q}));
  return BUILTIN.map(q=>{ const o=ov[q.id]; if(!o) return q; if(o.del) return null; return {...q,...o,edited:true}; }).filter(Boolean).concat(mine);
}
let QMAP=null, QMAP_KEY="";
function qById(id){ const k=Object.keys(S.myq).length+":"+JSON.stringify(S.qov||{}).length; if(!QMAP||QMAP_KEY!==k||!QMAP[id]){ QMAP={}; allQ().forEach(q=>QMAP[q.id]=q); QMAP_KEY=k; } return QMAP[id]; }
function grade(id,r){
  const t=today();
  const st=S.qs[id]||{b:0,n:0,c:0};
  const fresh=!st.n;
  let b=st.b||0;
  if(r==="x") b=0; else if(r==="u") b=Math.min(b,1); else b=fresh?4:Math.min(b+1,5);
  S.qs[id]={b,d:addDays(t,INT[b]),n:(st.n||0)+1,c:(st.c||0)+(r==="x"?0:1),r,t,f:st.f||t};
  S.log[t]=(S.log[t]||0)+1;
  mark("qs"); mark("log");
}
function stCls(st){ if(!st||!st.n) return ""; if(st.r==="x") return "x"; if(st.r==="u") return "u"; return st.b>=5?"m":"o"; }

function plan(){
  const t=today(); const all=allQ();
  let unanswered=0,newToday=0,revToday=0; const due=[];
  all.forEach(q=>{ const st=S.qs[q.id];
    if(!st||!st.n){ unanswered++; return; }
    if(st.f===t) newToday++; else if(st.t===t) revToday++;
    if(st.d&&st.d<=t) due.push(q); });
  due.sort((a,b)=>S.qs[a.id].d<S.qs[b.id].d?-1:1);
  const quota=S.settings.newPerDay;
  const finish = unanswered? addDays(t, Math.ceil(Math.max(0,unanswered-(quota-Math.min(newToday,quota)))/quota) + (newToday<quota?0:1)) : t;
  return {all,unanswered,newToday,revToday,due,quota,finish,daysToExam:diff(t,S.settings.examDate)};
}

function pickNext(p){
  const d=p.due.find(q=>inFilter(q)&&!session.skip.has(q.id)); if(d) return {q:d,kind:"rev"};

function sampleErr(e){
  const c=e&&e.code;

function catStats(){
  const r={}; CAT_ORDER.forEach(c=>r[c]={tot:0,done:0,ok:0,att:0,cor:0});
  allQ().forEach(q=>{ const st=S.qs[q.id], x=r[q.c]; x.tot++; if(st&&st.n){ x.done++; if(st.r!=="x") x.ok++; x.att+=st.n; x.cor+=st.c; } });
  return r;
}
function radarSVG(vals,targets){
  const cx=180,cy=170,R=118,N=CAT_ORDER.length;
  const ang=i=>-Math.PI/2+i*2*Math.PI/N;
  const pt=(i,v)=>[cx+Math.cos(ang(i))*R*v,cy+Math.sin(ang(i))*R*v];
  const poly=a=>a.map((v,i)=>pt(i,v).map(x=>x.toFixed(1)).join(",")).join(" ");
  let g="";
  [0.25,0.5,0.75,1].forEach(k=>g+=`<polygon class="ax" points="${poly(Array(N).fill(k))}"/>`);
  for(let i=0;i<N;i++){ const [x,y]=pt(i,1); g+=`<line class="ax" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`; }
  [25,50,75].forEach((k,j)=>g+=`<text x="${cx+5}" y="${cy-R*(j+1)/4+4}" style="font-size:10px;fill:var(--muted)">${k}</text>`);
  g+=`<polygon class="tg" points="${poly(targets)}"/><polygon class="me" points="${poly(vals)}"/>`;
  vals.forEach((v,i)=>{ const [x,y]=pt(i,v); g+=`<circle class="pt" cx="${x}" cy="${y}" r="3"/>`; });
  CAT_ORDER.forEach((c,i)=>{ const [x,y]=pt(i,1.17); const a=Math.abs(x-cx)<5?"middle":x>cx?"start":"end";
    g+=`<text x="${x}" y="${y+2}" text-anchor="${a}">${CATS[c].name}</text><text x="${x}" y="${y+19}" text-anchor="${a}" style="font-family:var(--en);font-size:15px;fill:var(--sakura-deep)">${Math.round(vals[i]*100)}%</text>`; });
  return `<svg class="radar" viewBox="-70 0 500 345" role="img" aria-label="分野別の正答率">${g}</svg>`;
}
function heat(){
  const t=today(), start=addDays(t,-7*18+1), sd=parse(start).getDay();
  let cells=""; for(let i=0;i<sd;i++) cells+=`<i style="visibility:hidden"></i>`;
  let total=0; const ba=bookActivityByDay(), pd=paByDay(); const act=d=>(S.log[d]||0)+(pd[d]||0)+Math.round((ba[d]||0)/3);
  for(let i=0;i<7*18;i++){ const d=addDays(start,i); const q=S.log[d]||0, v=act(d); total+=q; cells+=`<i class="${v===0?"":v<10?"l1":v<25?"l2":"l3"}" title="${d}:アプリ${q}問${pd[d]?" ・ 過去問"+pd[d]+"問":""}${ba[d]?" ・ 教材"+ba[d]+"分":""}"></i>`; }
  let streak=0,d=t; if(!act(d)) d=addDays(d,-1); while(act(d)){ streak++; d=addDays(d,-1); }
  return {html:`<div class="heat">${cells}</div>`,total,streak};
}

let mockView=null, mockCur=1, mockEnter=Date.now(), clockTimer=null;
function activeMock(){ return Object.entries(S.mocks).find(([,m])=>m&&!m.done); }

function fmtClock(sec){ sec=Math.max(0,Math.round(sec)); const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60; return `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function buildMock(){
  const all=allQ(); const used=new Set(); const qs=[];
  for(let n=1;n<=50;n++){
    const c=slotCat(n);
    if(S.settings.exempt&&isMenjo(n)){ qs.push({n,c,skip:true}); continue; }
    let pool=all.filter(q=>q.c===c);
    if(c==="zei") pool=pool.filter(q=>isMenjo(n)?!TAX_TOPICS.has(q.t):TAX_TOPICS.has(q.t));
    const fresh=x=>!used.has(x.id);
    const O=pool.filter(q=>q.a==="o"), X=pool.filter(q=>q.a==="x");
    // 正しいもの=○1+×3 / 誤っているもの=×1+○3。数が多い方の作り方を選びやすくする
    let type = Math.random() < X.length/(X.length+O.length+0.0001)*1.1 ? "t" : "f";
    if(type==="t"&&X.length<3) type="f"; if(type==="f"&&O.length<3) type="t";
    const one = type==="t"?O:X, three = type==="t"?X:O;
    // なるべく同じ論点でそろえる
    const topics=shuffle([...new Set(pool.map(q=>q.t))]);
    let pickOne=null, pickThree=[];
    for(const t of topics){
      const a=shuffle(one.filter(q=>q.t===t&&fresh(q))), b=shuffle(three.filter(q=>q.t===t&&fresh(q)));
      if(a.length&&b.length>=3){ pickOne=a[0]; pickThree=b.slice(0,3); break; }
    }
    if(!pickOne){
      pickOne = shuffle(one.filter(fresh))[0] || shuffle(one.slice())[0];
      const rest = shuffle(three.filter(fresh)).concat(shuffle(three.filter(q=>!fresh(q))));
      // 同じ論点を優先
      rest.sort((a,b)=>(b.t===pickOne.t)-(a.t===pickOne.t));
      pickThree=rest.slice(0,3);
    }
    const ids=shuffle([pickOne,...pickThree]).map(q=>q.id);
    ids.forEach(id=>used.add(id));
    qs.push({n,c,type,ids,ans:ids.indexOf(pickOne.id)});
  }
  return qs;
}

function parseToc(text,defaultCat){
  const out=[]; let cat=defaultCat||"kenri";
  const catOfLine=s=>/権利関係|民法/.test(s)?"kenri":/宅建業法|宅地建物取引業法/.test(s)?"gyoho":/法令上の制限/.test(s)?"hourei":/税|その他|免除|価格/.test(s)?"zei":null;
  text.split(/\r?\n/).forEach(raw=>{
    let s=raw.replace(/\t/g," ").trim(); if(!s) return;
    if(s.includes("|")){ const a=s.split("|").map(x=>x.trim()); const c=catOfLine(a[0])||cat; out.push({c,lab:a[1]||"",title:a[2]||"",p1:a[3]||""}); return; }
    const pm=s.match(/(\d+)\s*$/);
    const c2=catOfLine(s);
    if(!pm&&c2&&s.length<30){ cat=c2; return; }
    let p1=pm?pm[1]:"";
    let body=pm?s.replace(/[\s\.…・‥\-–—]*(?:p\.?|P\.?|ページ)?\s*\d+\s*$/,""):s;
    const lm=body.match(/^((?:CHAPTER|Chapter|CH|Ch|SECTION|Section|SEC|Sec|第)\s*0*\d+\s*(?:章|節|編)?|\d+[\.\-]\d+|\d+)\s*[\.:：、\s]?\s*(.*)$/);
    let lab="", title=body;
    if(lm){ lab=lm[1].trim(); title=lm[2].trim()||body; }
    if(c2&&!lab&&!p1){ cat=c2; return; }
    out.push({c:cat,lab,title,p1});
  });
  return out.map(x=>({...x,topics:autoTopics(x.c,x.title)}));
}

async function tocFromImage(file){

画像にない章を推測で足さないこと。
返答はJSONのみ: [{"cat":"","lab":"","title":"","page":""}]`;
  try{

  }catch(e){ bk.ai.err= e&&e.code==="image_rejected"?"この画像は使えません。別の写真で試してください。":sampleErr(e); }
  bk.ai.busy=false; render();
}

  if(d.mview){ mockView=d.mview; render(); window.scrollTo(0,0); return; }

  if(d.act==="mdelete"){ const m=S.mocks[mockView]; if(!m) return; if(!m.confirmDel){ m.confirmDel=true; render(); return; } delete S.mocks[mockView]; mark(mockView); mockView=null; render(); return; }

    const ids=["qs","cards","log",...Object.keys(S.mocks)]; S.qs={}; S.cards={}; S.mocks={}; S.log={}; confirmReset=false; session.cur=null; session.ans=null;
    ids.forEach(id=>mark(id)); toast("学習記録を消しました"); render(); return; }
